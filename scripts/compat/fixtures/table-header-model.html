<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Header model</title></head>
<body><main>
  <h1>Header relationship model</h1>
  <table>
    <caption>Regional measures</caption>
    <tr><th id="domain" abbr="D">Domain heading</th><th id="metric" headers="domain">Metric heading</th></tr>
    <tr><th id="region" scope="row">North region</th><td id="header-value" headers="metric region"><a href="/measure">Measured value</a></td></tr>
  </table>
  <table>
    <tr><th id="far" scope="col">Far heading</th></tr>
    <tr><td>Intervening data</td></tr>
    <tr><th id="near" scope="col">Near heading</th></tr>
    <tr><td id="opaque-value">Opaque scan value</td></tr>
  </table>
</main></body>
</html>
