<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Grid dashboard</title><style>
#dashboard{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:48px;gap:8px}
#summary{grid-column:1/3}#activity{grid-row:1/3;grid-column:3}#traffic{grid-column:1/4}
</style></head><body><main><h1>Operations dashboard</h1><section id="dashboard">
<article id="summary"><h2>Summary</h2><p>All services healthy</p></article>
<article id="activity"><h2>Activity</h2><p>Forty recent events</p></article>
<article id="latency"><h2>Latency</h2><p>Twenty milliseconds</p></article>
<article id="errors"><h2>Errors</h2><p>No elevated errors</p></article>
<article id="traffic"><h2>Traffic</h2><p>Steady request volume</p></article>
</section></main></body></html>
