<!doctype html><meta charset="utf-8"><title>Scroll and containment</title>
<style>
html,body,p{margin:0;font-size:16px;line-height:16px}
#scroll{width:160px;height:32px;overflow:hidden auto}
#first{height:64px}#last{height:16px}
#article{width:160px;height:16px}
#contained{contain:paint;width:160px;height:32px;margin-top:16px}
#fixed{position:fixed;left:0;top:0;width:40px;height:16px}
#leak{position:absolute;top:64px;left:0;width:80px;height:16px}
</style>
<div id="scroll"><div id="first">FIRST</div><div id="last">LAST</div></div>
<p id="article">ARTICLE</p>
<div id="contained"><div id="fixed">FIXED</div><div id="leak">CLIPPED</div></div>
