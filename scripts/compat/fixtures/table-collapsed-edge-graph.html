<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Collapsed edge graph</title></head>
<body><main>
  <h1>Collapsed edge graph</h1>
  <table id="empty-collapsed" style="width:80px;height:32px;border:3px solid red;border-collapse:collapse"></table>
  <table style="width:240px;border:4px solid black;border-collapse:collapse">
    <tr><td id="span-edge" colspan="2" style="border:2px solid red">Spanning edge</td><td style="border:1px solid blue">Corner</td></tr>
    <tr><td style="border:1px solid green">Lower left</td><td id="missing-neighbor" style="border-left:3px solid black">Lower middle</td></tr>
  </table>
</main></body>
</html>
