<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Row group ordering</title></head>
<body><main>
  <h1>Displayed row group order</h1>
  <div style="display:table;table-layout:fixed;width:240px;border-spacing:0">
    <div style="display:table-footer-group"><div style="display:table-row"><span id="display-footer" style="display:table-cell">Displayed footer</span></div></div>
    <div style="display:table-row-group"><div style="display:table-row"><span id="display-body" style="display:table-cell">Displayed body</span></div></div>
    <div style="display:table-header-group"><div style="display:table-row"><span id="display-header" style="display:table-cell;width:40px">Displayed header</span><span style="display:table-cell">Header detail</span></div></div>
  </div>
</main></body>
</html>
