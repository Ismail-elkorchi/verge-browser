<!doctype html><meta charset="utf-8"><title>Media calculation</title>
<style>
html,body{margin:0;font-size:16px;line-height:16px}
#box{width:calc(1in + 4px);height:32px;color:blue}
@media(max-width:calc(1120px - 1px)){#box{width:min(160px,calc(1in + 64px));color:red}}
</style>
<div id="box">MATH</div>
