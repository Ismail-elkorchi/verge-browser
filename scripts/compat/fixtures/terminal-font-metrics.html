<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Terminal font metrics</title><style>
body{margin:0;font-size:14px}p{margin:0}.tiny{font-size:1px}.small{font-size:8px}.compact{font-size:14px}.continuity{font-size:24px}.normal{font-size:16px}.large{font-size:32px}.zero{font-size:0}.restored{font-size:14px}#geometry{width:96px;height:32px;background:#123456;color:#ffffff}
</style></head><body><main>
<p class="tiny" id="tiny">Tiny letters stay complete</p>
<p class="small" id="small">Small words remain readable</p>
<p class="compact" id="compact">alpha<br>bravo<br>charlie<br>delta<br>echo</p>
<p class="continuity" id="continuity">alpha beta gamma</p>
<p class="normal" id="normal">Normal text has source ownership</p>
<p class="large" id="large">Large text wraps without loss</p>
<p class="zero" id="zero">INTENTIONALLY ZERO FONT<span class="restored" id="restored">Restored child remains visible</span></p>
<p id="geometry">Color box</p>
<p>Final line survives every viewport window</p>
</main></body></html>
