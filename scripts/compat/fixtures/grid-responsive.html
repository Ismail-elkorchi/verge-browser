<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Responsive Grid</title><style>
#responsive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.panel{min-height:32px}
</style></head><body><main><h1>Responsive field reports</h1><section id="responsive-grid">
<article class="panel" id="panel-one">Northern report</article><article class="panel" id="panel-two">Eastern report</article>
<article class="panel" id="panel-three">Southern report</article><article class="panel" id="panel-four">Western report</article>
<article class="panel" id="panel-five">Central report</article><article class="panel" id="panel-six">Coastal report</article>
</section></main></body></html>
