<!doctype html><html lang="en"><head><title>Checkout</title><style>
form{max-width:32rem}.field{margin:.75rem 0}label{display:block}.actions{display:flex;justify-content:flex-end;gap:.5rem}
</style></head><body><header><h1>Checkout</h1></header><main><form aria-label="Delivery details"><div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name"></div><div class="field"><label for="address">Address</label><textarea id="address" name="address"></textarea></div><fieldset><legend>Delivery</legend><label><input type="radio" name="delivery" checked> Standard</label><label><input type="radio" name="delivery"> Express</label></fieldset><div class="actions"><button type="submit">Place order</button></div></form></main></body></html>
