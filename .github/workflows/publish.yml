name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z or vX.Y.Z)"
        required: true
        type: string
      ref:
        description: "Git ref to publish from when manually dispatched"
        required: false
        default: main
        type: string
      dry_run:
        description: "Run publish in dry-run mode"
        required: false
        default: false
        type: boolean
      publish_target:
        description: "Registries to publish"
        required: false
        default: all
        type: choice
        options:
          - all
          - npm
          - jsr

concurrency:
  group: publish-${{ github.repository }}-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DENO_PUBLISH_VERSION: "2.9.3"
      PUBLISH_ARTIFACTS_DIR: ${{ runner.temp }}/verge-browser-publish
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v${{ env.DENO_PUBLISH_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Resolve publish metadata
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          PUBLISH_TARGET_INPUT: ${{ inputs.publish_target }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"
          jsr_version="$(jq -r '.version' jsr.json)"

          if [ -z "${package_name}" ] || [ "${package_name}" = "null" ]; then
            echo "::error::Missing package name in package.json"
            exit 1
          fi

          if [ "${package_version}" != "${jsr_version}" ]; then
            echo "::error::Version mismatch: package.json=${package_version} jsr.json=${jsr_version}"
            exit 1
          fi

          expected_version=""
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            expected_version="${RELEASE_TAG#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            expected_version="${VERSION_INPUT#v}"
          else
            echo "::error::Unsupported event ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          if ! printf '%s' "${expected_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Expected semantic version x.y.z, got '${expected_version}'"
            exit 1
          fi

          if [ "${expected_version}" != "${package_version}" ]; then
            echo "::error::Version mismatch: expected=${expected_version} package=${package_version}"
            exit 1
          fi

          expected_tag="v${package_version}"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
              echo "::error::Release tag must be ${expected_tag}, got ${RELEASE_TAG}"
              exit 1
            fi
            tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "${checkout_commit}" != "${tag_commit}" ] || [ "${checkout_commit}" != "${GITHUB_SHA}" ]; then
              echo "::error::Checkout, release tag, and event SHA do not identify the same commit"
              exit 1
            fi
          fi

          dry_run="false"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN_INPUT}" = "true" ]; then
            dry_run="true"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${dry_run}" != "true" ]; then
            if [ "${REF_INPUT}" != "${expected_tag}" ]; then
              echo "::error::A real manual publish must check out the exact ${expected_tag} tag"
              exit 1
            fi
            tag_commit="$(git rev-parse "${expected_tag}^{commit}")"
            if [ "${checkout_commit}" != "${tag_commit}" ]; then
              echo "::error::Manual publish checkout does not match ${expected_tag}"
              exit 1
            fi
          fi

          publish_target="all"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${PUBLISH_TARGET_INPUT}" ]; then
            publish_target="${PUBLISH_TARGET_INPUT}"
          fi

          case "${publish_target}" in
            all)
              publish_npm="true"
              publish_jsr="true"
              ;;
            npm)
              publish_npm="true"
              publish_jsr="false"
              ;;
            jsr)
              publish_npm="false"
              publish_jsr="true"
              ;;
            *)
              echo "::error::Unsupported publish target '${publish_target}'"
              exit 1
              ;;
          esac

          mkdir -p "${PUBLISH_ARTIFACTS_DIR}"
          {
            echo "package_name=${package_name}"
            echo "version=${package_version}"
            echo "commit_sha=${checkout_commit}"
            echo "ref=${GITHUB_REF}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "dry_run=${dry_run}"
            echo "publish_target=${publish_target}"
            echo "publish_npm=${publish_npm}"
            echo "publish_jsr=${publish_jsr}"
          } | tee "${PUBLISH_ARTIFACTS_DIR}/publish-summary.txt"

          {
            echo "package_name=${package_name}"
            echo "version=${package_version}"
            echo "commit_sha=${checkout_commit}"
            echo "dry_run=${dry_run}"
            echo "publish_target=${publish_target}"
            echo "publish_npm=${publish_npm}"
            echo "publish_jsr=${publish_jsr}"
          } >> "${GITHUB_OUTPUT}"

      - name: Print publish metadata
        run: |
          echo "package=${{ steps.meta.outputs.package_name }}"
          echo "version=${{ steps.meta.outputs.version }}"
          echo "commit=${{ steps.meta.outputs.commit_sha }}"
          echo "dry_run=${{ steps.meta.outputs.dry_run }}"
          echo "publish_target=${{ steps.meta.outputs.publish_target }}"
          echo "publish_npm=${{ steps.meta.outputs.publish_npm }}"
          echo "publish_jsr=${{ steps.meta.outputs.publish_jsr }}"

      - name: Run publish gates
        run: |
          set -euo pipefail
          npm run release:check
          npm run docs:html:jsr

      - name: Verify qualified revision
        env:
          QUALIFIED_COMMIT: ${{ steps.meta.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFIED_COMMIT}"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Ensure npm version does not already exist
        if: ${{ steps.meta.outputs.publish_npm == 'true' }}
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          npm_view_output="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>&1)"
          npm_view_status=$?
          set -e

          if [ ${npm_view_status} -eq 0 ]; then
            echo "::error::npm version already exists: ${PACKAGE_NAME}@${VERSION}"
            echo "${npm_view_output}"
            exit 1
          fi

          if printf '%s' "${npm_view_output}" | grep -Eqi 'E404|404 Not Found|not found'; then
            echo "npm version does not exist yet: ${PACKAGE_NAME}@${VERSION}"
          else
            echo "::error::Unable to verify npm version state for ${PACKAGE_NAME}@${VERSION}"
            echo "${npm_view_output}"
            exit 1
          fi

      - name: Ensure JSR version does not already exist
        if: ${{ steps.meta.outputs.publish_jsr == 'true' }}
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          scope="${PACKAGE_NAME#@}"
          scope="${scope%%/*}"
          package="${PACKAGE_NAME##*/}"
          metadata_url="https://jsr.io/@${scope}/${package}/${VERSION}_meta.json"
          metadata_output="${PUBLISH_ARTIFACTS_DIR}/jsr-version-meta.json"

          http_status="$(curl -sS -o "${metadata_output}" -w '%{http_code}' -H 'Accept: application/json' "${metadata_url}")"

          case "${http_status}" in
            200)
              echo "::error::JSR version already exists: ${PACKAGE_NAME}@${VERSION}"
              cat "${metadata_output}"
              exit 1
              ;;
            404)
              echo "JSR version does not exist yet: ${PACKAGE_NAME}@${VERSION}"
              rm -f "${metadata_output}"
              ;;
            *)
              echo "::error::Unable to verify JSR version state for ${PACKAGE_NAME}@${VERSION}"
              echo "metadata_url=${metadata_url}"
              echo "http_status=${http_status}"
              cat "${metadata_output}" || true
              exit 1
              ;;
          esac

      - name: Generate npm pack manifest
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          printf '%s\n' "${pack_json}" > "${PUBLISH_ARTIFACTS_DIR}/npm-pack.json"
          tarball="$(printf '%s\n' "${pack_json}" | node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(data[0].filename);')"
          tar -tzf "${tarball}" | sort > "${PUBLISH_ARTIFACTS_DIR}/npm-pack-file-list.txt"
          rm -f "${tarball}"

      - name: Run JSR publish dry-run
        if: ${{ steps.meta.outputs.publish_jsr == 'true' }}
        run: |
          set -euo pipefail
          test "$(deno --version | head -1 | awk '{print $2}')" = "${DENO_PUBLISH_VERSION}"
          deno publish --dry-run 2>&1 | tee "${PUBLISH_ARTIFACTS_DIR}/jsr-publish-dry-run.txt"

      - name: Run npm publish dry-run
        if: ${{ steps.meta.outputs.dry_run == 'true' && steps.meta.outputs.publish_npm == 'true' }}
        run: npm publish --dry-run

      - name: Upload publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-${{ steps.meta.outputs.version }}
          path: |
            ${{ env.PUBLISH_ARTIFACTS_DIR }}/
            tmp/jsr-docs-html/

      - name: Ensure tokenless npm auth for OIDC publish
        if: ${{ steps.meta.outputs.dry_run != 'true' && steps.meta.outputs.publish_npm == 'true' }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish npm (trusted publishing)
        if: ${{ steps.meta.outputs.dry_run != 'true' && steps.meta.outputs.publish_npm == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

      - name: Publish JSR
        if: ${{ steps.meta.outputs.dry_run != 'true' && steps.meta.outputs.publish_jsr == 'true' }}
        run: deno publish
