name: Publish Manual

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish from (tag, branch, or SHA)"
        required: true
        default: main
        type: string
      dry_run:
        description: "Run publish in dry-run mode"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Resolve publish metadata
        id: meta
        run: |
          set -euo pipefail
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"
          jsr_version="$(jq -r '.version' jsr.json)"

          if [ "${package_version}" != "${jsr_version}" ]; then
            echo "::error::Version mismatch: package.json=${package_version} jsr.json=${jsr_version}"
            exit 1
          fi

          mkdir -p publish-artifacts
          {
            echo "package_name=${package_name}"
            echo "version=${package_version}"
            echo "ref=${{ inputs.ref }}"
            echo "dry_run=${{ inputs.dry_run }}"
          } | tee publish-artifacts/publish-manual-summary.txt

          {
            echo "package_name=${package_name}"
            echo "version=${package_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run publish gates
        run: |
          set -euo pipefail
          npm run release:check
          npm run docs:html:jsr

      - name: Ensure npm version does not already exist
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          npm_view_output="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>&1)"
          npm_view_status=$?
          set -e

          if [ ${npm_view_status} -eq 0 ]; then
            echo "::error::npm version already exists: ${PACKAGE_NAME}@${VERSION}"
            echo "${npm_view_output}"
            exit 1
          fi

          if printf '%s' "${npm_view_output}" | grep -Eqi 'E404|404 Not Found|not found'; then
            echo "npm version does not exist yet: ${PACKAGE_NAME}@${VERSION}"
          else
            echo "::error::Unable to verify npm version state for ${PACKAGE_NAME}@${VERSION}"
            echo "${npm_view_output}"
            exit 1
          fi

      - name: Ensure JSR version does not already exist
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          scope="${PACKAGE_NAME#@}"
          scope="${scope%%/*}"
          package="${PACKAGE_NAME##*/}"
          metadata_url="https://jsr.io/@${scope}/${package}/${VERSION}_meta.json"
          metadata_output="publish-artifacts/jsr-version-meta.json"

          http_status="$(curl -sS -o "${metadata_output}" -w '%{http_code}' -H 'Accept: application/json' "${metadata_url}")"

          case "${http_status}" in
            200)
              echo "::error::JSR version already exists: ${PACKAGE_NAME}@${VERSION}"
              cat "${metadata_output}"
              exit 1
              ;;
            404)
              echo "JSR version does not exist yet: ${PACKAGE_NAME}@${VERSION}"
              rm -f "${metadata_output}"
              ;;
            *)
              echo "::error::Unable to verify JSR version state for ${PACKAGE_NAME}@${VERSION}"
              echo "metadata_url=${metadata_url}"
              echo "http_status=${http_status}"
              cat "${metadata_output}" || true
              exit 1
              ;;
          esac

      - name: Generate npm pack manifest
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          printf '%s\n' "${pack_json}" > publish-artifacts/npm-pack.json
          tarball="$(printf '%s\n' "${pack_json}" | node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(data[0].filename);')"
          tar -tzf "${tarball}" | sort > publish-artifacts/npm-pack-file-list.txt
          rm -f "${tarball}"

      - name: Run npm publish dry-run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run

      - name: Run JSR publish dry-run
        if: ${{ inputs.dry_run }}
        run: npx -y jsr publish --dry-run --allow-dirty

      - name: Ensure tokenless npm auth for OIDC publish
        if: ${{ !inputs.dry_run }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish npm (trusted publishing)
        if: ${{ !inputs.dry_run }}
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

      - name: Publish JSR
        if: ${{ !inputs.dry_run }}
        run: npx -y jsr publish --allow-dirty --provenance

      - name: Upload manual publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-manual-${{ steps.meta.outputs.version }}
          path: |
            publish-artifacts/
            tmp/jsr-docs-html/
